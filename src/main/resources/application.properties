spring.application.name=spring-boot4-otel

# Resource attributes attached to every log record, metric and span
management.opentelemetry.resource-attributes.deployment.environment.name=local

# Traces: sample every request (default is 10%)
management.tracing.sampling.probability=1.0

# Metrics: push every 10s instead of the default 1 minute
management.otlp.metrics.export.step=10s

# Publish histogram buckets for HTTP server requests so latency percentiles can be computed in Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# OTLP endpoints for logs, metrics and traces are provided automatically by
# Docker Compose (compose.yaml) or Testcontainers (TestcontainersConfiguration).
# When running against an external collector, set them explicitly, e.g.:
# management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
# management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
# management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
